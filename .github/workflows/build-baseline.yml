name: Build SANBridge V2

on:
  workflow_dispatch:
  push:
    branches:
      - sanbridge-headless-v2

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out SANBridge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build portable SANBridge
        run: npm run win:portable

      - name: Upload portable SANBridge
        uses: actions/upload-artifact@v4
        with:
          name: SANBridge-Portable-Windows-x64
          path: _release/win-unpacked/**
          if-no-files-found: error
