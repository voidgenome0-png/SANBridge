name: Build SANBridge Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - sanbridge-headless-v1

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out SANBridge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build original Windows application
        run: npm run win -- --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SANBridge-Baseline-Windows
          path: _release/*.exe
          if-no-files-found: error
